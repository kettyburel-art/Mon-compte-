<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Compte — Ketty Burel</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a2540">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon.png">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script>
    // Désinstaller l'ancien service worker au cas où
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs){
        regs.forEach(function(r){ r.unregister(); });
      }).then(function(){
        // Réinstaller le nouveau
        navigator.serviceWorker.register('sw.js').catch(function(e){ console.warn('SW reg failed', e); });
      });
    }
    // Redirection vers l'app
    location.replace('gestion-compte-ketty.html?v=' + Date.now());
  </script>
</head>
<body>
  <p style="font-family:sans-serif;text-align:center;padding:40px">Chargement de Mon Compte...</p>
  <p style="text-align:center"><a href="gestion-compte-ketty.html">Cliquer ici si la redirection ne fonctionne pas</a></p>
</body>
</html>
